<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Training Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..700&family=Figtree:wght@400..600&display=swap">
<style>
/* Layout: one screen at a time from a bottom tab bar, bright and light. The whole page takes the colour of whoever is logging: pink for Noey, blue for Poom. */
:root {
  color-scheme: light;
  --bg: #FFF9FB; --field: #FFFFFF; --tint: #FFE6EF;
  --ink: #2B1E26; --ink2: #54404B; --muted: #7D5A6B;
  --line: #F6DCE6; --axis: #EDB8CC;
  --band: #FFF0F5; --band-ink: #2B1E26; --band-muted: #7D5A6B; --band-line: #F3C2D4; --band-field: #FFFFFF;
  --accent: #D6336C; --on-accent: #FFFFFF; --gold: #FFC53D;
  --s1: #D6336C; --s2: #E8850C;
  --tabbar: 66px;
  --display: "Bricolage Grotesque", "Figtree", "Leelawadee UI", system-ui, sans-serif;
  --body: "Figtree", "Leelawadee UI", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-person="poom"] {
  --bg: #F7FBFF; --tint: #E2F0FF;
  --ink: #14263D; --ink2: #33475F; --muted: #506A85;
  --line: #D8E8F8; --axis: #A9CBEF;
  --band: #EEF6FF; --band-ink: #14263D; --band-muted: #506A85; --band-line: #BCD8F7;
  --accent: #1769D2; --s1: #1769D2;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.score :focus-visible { outline-color: var(--accent); }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--tabbar) + 32px); display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: .01em; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--ink); font-weight: 600; }
.backup { display: flex; gap: 6px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; background: var(--field); border-top: 1px solid var(--axis); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 728px) / 2)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 728px) / 2)); }
nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 53px; background: none; border: 0; border-radius: 10px; padding: 5px 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button:hover { color: var(--ink); }
nav button[aria-current=page] { background: var(--tint); color: var(--accent); font-weight: 700; }

.who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: var(--tint); border-radius: 14px; padding: 4px; }
.who button { min-height: 42px; background: none; border: 0; border-radius: 11px; color: var(--ink2); font-weight: 600; }
.who button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }

.banner { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 14px; color: var(--ink2); }
.banner b { color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.pane { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.pane[hidden] { display: none !important; }

/* scoreboard */
.score { background: var(--band); color: var(--band-ink); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.datenav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.datenav h2 { margin: 0; font: 600 17px/1.3 var(--display); flex: 1 1 100%; text-wrap: balance; }
.datenav button, .datenav input { background: var(--band-field); border: 1px solid var(--band-line); border-radius: 4px; color: var(--band-ink); min-height: 36px; padding: 4px 10px; }
.datenav input { flex: 1 1 130px; min-width: 0; color-scheme: light; }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.metric { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.metric label { font-size: 14px; font-weight: 500; color: var(--band-muted); }
.bigfield { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--band-line); }
.bigfield:focus-within { border-color: var(--accent); }
.bigfield input { width: 100%; min-width: 0; background: none; border: 0; outline: 0; padding: 0; color: var(--band-ink); font: 600 34px/1.25 var(--display); caret-color: var(--accent); }
.bigfield input::placeholder { color: var(--axis); }
.bigfield span { font-size: 13px; color: var(--band-muted); }
.addrow { display: flex; gap: 4px; margin-top: 4px; }
.addrow input { flex: 1 1 0; width: 100%; min-width: 0; background: var(--band-field); border: 1px solid var(--band-line); border-radius: 4px; padding: 3px 8px; color: var(--band-ink); font-size: 16px; }
.addrow input::placeholder { color: var(--band-muted); font-size: 13px; }
.addrow button { flex: none; background: var(--band-field); border: 1px solid var(--band-line); border-radius: 4px; color: var(--accent); font-weight: 600; padding: 2px 10px; font-size: 13px; }
.net { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; border-top: 1px solid var(--band-line); padding-top: 10px; font-size: 13px; color: var(--band-muted); }
.net strong { font: 700 22px/1.2 var(--display); color: var(--band-ink); }
#plan-deficit { color: var(--accent); }

/* workout */
.sect h3, .chart h3 { margin: 0; font: 600 17px/1.3 var(--display); }
.sect { display: flex; flex-direction: column; gap: 12px; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; background: var(--field); border: 1px solid var(--axis); border-radius: 4px; }
.chip button { background: none; border: 0; padding: 8px 12px; min-height: 42px; font-weight: 500; }
.chip button.x { padding: 6px 8px 6px 0; color: var(--muted); font-weight: 400; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.on button.x { color: var(--on-accent); }
.part { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.part h4 { margin: 0; font: 600 14px/1.3 var(--display); }
.addsplit { display: flex; gap: 6px; }
.addsplit input { flex: 1 1 auto; min-width: 0; }
.txt { background: var(--field); border: 1px solid var(--axis); border-radius: 4px; padding: 8px 10px; min-height: 44px; width: 100%; font-size: 16px; }
.btn { background: var(--field); border: 1px solid var(--axis); border-radius: 4px; padding: 8px 14px; min-height: 44px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.copy { white-space: normal; text-align: left; }

.ex { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ex-head { display: flex; gap: 6px; align-items: center; }
.ex-head input { flex: 1 1 auto; min-width: 0; font-weight: 600; background: var(--tint); }
.icon { flex: none; width: 32px; height: 32px; background: none; border: 0; border-radius: 4px; color: var(--muted); font-size: 18px; line-height: 1; }
.icon:hover { background: var(--line); color: var(--ink); }
.ex .prev { font-size: 13px; color: var(--muted); }
.setrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px minmax(0, 1fr) 32px; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.setrow .n { font-size: 13px; color: var(--muted); text-align: right; }
.setrow .times { color: var(--muted); text-align: center; }
.setrow input { background: var(--tint); text-align: right; }
.sethead { font-size: 12px; color: var(--muted); }
.sethead span:nth-child(2), .sethead span:nth-child(4) { text-align: right; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr) 14px minmax(0, 1fr); align-items: end; gap: 6px; font-variant-numeric: tabular-nums; }
.quick div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.quick label { font-size: 12px; color: var(--muted); }
.quick input { background: var(--tint); text-align: right; }
.quick .times { color: var(--muted); text-align: center; padding-bottom: 7px; }
.ex-foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.ex-sum { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pr { background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 600; border-radius: 3px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }

/* charts */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 12px; color: var(--ink2); font-size: 14px; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.chart { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; align-items: baseline; }
.chart-sum { color: var(--ink2); font-size: 14px; }
.hero { font: 600 30px/1.2 var(--display); color: var(--ink); margin-right: 6px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.plot { position: relative; width: 100%; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.plot svg text { font: 11px var(--body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot svg text.dl { font-size: 12px; font-weight: 600; fill: var(--ink); }
.plot .grid-l { stroke: var(--line); stroke-width: 1; }
.plot .base-l { stroke: var(--axis); stroke-width: 1; }
.plot .cross { stroke: var(--axis); stroke-width: 1; }
.plot .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .dot { stroke: var(--bg); stroke-width: 2; }
.s1-s { stroke: var(--s1); } .s2-s { stroke: var(--s2); }
.s1-f { fill: var(--s1); } .s2-f { fill: var(--s2); }
.s1-b { background: var(--s1); } .s2-b { background: var(--s2); }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 5px 9px; font-size: 13px; line-height: 1.4; white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }
.tip div:first-child { font-weight: 600; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; outline: 1px solid var(--bg); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--axis); border-radius: 6px; }
.planform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.planform div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.planform label { font-size: 13px; color: var(--muted); }
.plan-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 600; }
.up { font-weight: 700; color: var(--accent); }
.subhead { margin: 8px 0 0; font: 600 14px/1.3 var(--display); }
.goals-title { margin: 0; font: 600 17px/1.3 var(--display); }
.goal-card { gap: 10px; }
.goal-row { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.goal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.now { font-size: 12px; font-weight: 600; border: 1px solid var(--ink); border-radius: 3px; padding: 0 6px; }
.meter { height: 6px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.data { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--axis); padding-top: 16px; }
.data h3 { margin: 0; font: 600 17px/1.3 var(--display); }
.data-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.selrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.selrow label { font-size: 13px; color: var(--muted); }
.selrow select { flex: 0 1 260px; min-width: 0; }

/* history */
.tablewrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px; white-space: nowrap; border-bottom: 1px solid var(--axis); }
td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
td.l { white-space: normal; min-width: 170px; color: var(--ink2); }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 12px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 6px; display: flex; gap: 12px; align-items: center; z-index: 5; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0; text-decoration: underline; }

/* Shape */
.brand { font-size: 26px; }
.score { border: 1px solid var(--band-line); border-radius: 20px; padding: 20px 18px; }
.datenav button, .datenav input, .addrow input, .addrow button { border-radius: 10px; }
.ex { border-radius: 16px; box-shadow: 0 1px 3px rgba(18, 56, 46, .08); padding: 14px; }
.chip { border-radius: 999px; }
.chip button { border-radius: 999px; }
.btn, .txt { border-radius: 10px; }
.seg { border-radius: 999px; }
.pr, .now { border-radius: 999px; }
.empty { border-radius: 14px; background: var(--field); }
.meter { height: 8px; border-radius: 4px; }
.meter i { border-radius: 4px; }
.toast { border-radius: 12px; }
.tablewrap { background: var(--field); border: 1px solid var(--line); border-radius: 14px; }
th, td { border-bottom-color: var(--line); }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Training Logbook</h1>
    <span class="status" id="status" role="status">Opening your logbook…</span>
  </header>
  <div class="who" id="who" role="group" aria-label="Who is logging" hidden></div>
  <div class="grid">
    <section class="pane" id="log" aria-label="Daily log"></section>
    <section class="pane" id="charts" aria-label="Charts" hidden></section>
    <section class="pane" id="history" aria-label="History" hidden></section>
    <section class="pane" id="plan" aria-label="TDEE plan" hidden></section>
    <section class="pane" id="goals" aria-label="Goals" hidden></section>
  </div>
  <section class="data" id="data-tools" aria-label="Your data" hidden>
    <h3>Your data</h3>
    <p class="hint">Everything is saved only in this browser on this device. Back up often and keep the file somewhere safe.</p>
    <div class="data-btns">
      <button type="button" class="btn" id="export-xlsx" hidden>Export to Excel</button>
      <span class="backup" id="backup" hidden>
        <button type="button" class="btn" id="backup-save">Back up</button>
        <button type="button" class="btn" id="backup-load">Restore</button>
        <input type="file" id="backup-file" accept=".json,application/json" aria-label="Choose backup file" hidden>
      </span>
    </div>
  </section>
</div>
<nav aria-label="Main">
  <button type="button" id="nav-log" data-view="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Log</button>
  <button type="button" id="nav-charts" data-view="charts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l4-5 3 3 5-7"/></svg>Charts</button>
  <button type="button" id="nav-history" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
  <button type="button" id="nav-plan" data-view="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/></svg>Plan</button>
  <button type="button" id="nav-goals" data-view="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 20 10 7l3.5 6 2-3 6 10z"/><path d="M8 10.5l2 1.5 2-1.5"/></svg>Goals</button>
</nav>
<div id="toast-root"></div>

<script>
(function () {
  'use strict';
  var LOCAL_KEY = 'somjod-v1';
  var DEFAULT_SPLITS = ['Chest', 'Back', 'Shoulders', 'Arms', 'Push', 'Pull', 'Legs', 'Full Body'];
  var COMMON_EXERCISES = ['Bench Press', 'Incline Dumbbell Press', 'Chest Fly', 'Push Up', 'Overhead Press', 'Lateral Raise', 'Rear Delt Fly', 'Lat Pulldown', 'Pull Up', 'Barbell Row', 'Seated Cable Row', 'Deadlift', 'Face Pull', 'Biceps Curl', 'Hammer Curl', 'Triceps Pushdown', 'Skull Crusher', 'Squat', 'Leg Press', 'Romanian Deadlift', 'Leg Curl', 'Leg Extension', 'Calf Raise', 'Hip Thrust'];

  var EXERCISES = {
    Chest: ['Bench Press', 'Incline Bench Press', 'Incline Dumbbell Press', 'Dumbbell Bench Press', 'Chest Press Machine', 'Chest Fly', 'Cable Crossover', 'Push Up', 'Dips'],
    Back: ['Lat Pulldown', 'Pull Up', 'Barbell Row', 'Dumbbell Row', 'Seated Cable Row', 'T-Bar Row', 'Deadlift', 'Face Pull', 'Back Extension'],
    Shoulders: ['Overhead Press', 'Dumbbell Shoulder Press', 'Shoulder Press Machine', 'Lateral Raise', 'Front Raise', 'Rear Delt Fly', 'Face Pull', 'Shrug'],
    Arms: ['Biceps Curl', 'Hammer Curl', 'Preacher Curl', 'Cable Curl', 'Triceps Pushdown', 'Skull Crusher', 'Overhead Triceps Extension', 'Dips'],
    Push: ['Bench Press', 'Incline Dumbbell Press', 'Chest Fly', 'Overhead Press', 'Lateral Raise', 'Triceps Pushdown', 'Skull Crusher', 'Dips', 'Push Up'],
    Pull: ['Lat Pulldown', 'Pull Up', 'Barbell Row', 'Seated Cable Row', 'Deadlift', 'Face Pull', 'Rear Delt Fly', 'Biceps Curl', 'Hammer Curl'],
    Legs: ['Squat', 'Leg Press', 'Romanian Deadlift', 'Lunge', 'Bulgarian Split Squat', 'Leg Extension', 'Leg Curl', 'Hip Thrust', 'Calf Raise'],
    'Full Body': ['Squat', 'Deadlift', 'Bench Press', 'Overhead Press', 'Barbell Row', 'Pull Up', 'Lunge', 'Push Up']
  };
  var PART_ALIASES = { 'อก': 'Chest', 'หลัง': 'Back', 'ไหล่': 'Shoulders', 'แขน': 'Arms', 'ขา': 'Legs' };
  function exercisesFor(part) { return EXERCISES[PART_ALIASES[part] || part] || null; }

  var state = {
    days: {}, customSplits: [], demoDays: null,
    date: null, view: 'log', range: '30', exercise: null,
    loaded: false, mode: null
  };
  var db = null, col = null;

  // ---------- people ----------
  // Noey keeps the original storage key, so anything already logged in this browser stays with Noey.
  var PROFILES = [
    { id: 'noey', label: 'Noey', key: LOCAL_KEY },
    { id: 'poom', label: 'Poom', key: LOCAL_KEY + '-phum' }
  ];
  var PROFILE_KEY = LOCAL_KEY + '-profile';
  state.profile = PROFILES[0].id;
  state.plans = [];
  state.part = 'all'; state.bucket = 'week';
  var GOALS = { cut: 'Cut', bulk: 'Bulk', maintain: 'Maintain' };
  var editingPlan = null;
  // When periods overlap, the one that started most recently applies.
  function planFor(date) {
    return state.plans.filter(function (p) { return p.start <= date && (!p.end || date <= p.end); })
      .sort(function (a, b) { return a.start < b.start ? 1 : -1; })[0] || null;
  }
  function cardioIn(p) {
    return Object.keys(state.days).reduce(function (sum, k) {
      return k >= p.start && (!p.end || k <= p.end) ? sum + (state.days[k].cardio || 0) : sum;
    }, 0);
  }
  function deficitFor(d, date) {
    var p = planFor(date);
    return p && d.calIn != null ? p.tdee - d.calIn : null;

          h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Date'), h('th', { scope: 'col', class: 'l' }, 'Weight × reps'))),
          h('tbody', null, sessions.filter(function (x) { return inR.indexOf(x.key) >= 0; }).reverse().map(function (x) {
            var label = fmtRow.format(keyToDate(x.key));

              h('td', null, usingDemo() ? label : h('button', { type: 'button', class: 'linkbtn', onclick: function () { setDate(x.key); setView('log'); } }, label)),
              h('td', { class: 'l' }, x.sets.map(function (q) { return (q.kg == null ? '–' : n(q.kg)) + '×' + (q.reps == null ? '–' : q.reps); }).join(', ')));
          }))))));
    }

  }

  function renderHistory() {

    root.appendChild(h('div', { class: 'tablewrap' }, h('table', null,
      h('thead', null, h('tr', null, ['Date', 'Workout', 'In', 'Out', 'Net', 'Deficit', 'Protein', 'Cardio', 'Body weight'].map(function (t, i) { return h('th', { scope: 'col', class: i === 1 ? 'l' : null }, t); }))),
      h('tbody', null, keys.map(function (k) {
        var d = days[k], label = fmtRow.format(keyToDate(k));
        var vol = d.exercises.reduce(function (a, e) { return a + volume(e); }, 0), logged = d.exercises.filter(hasValues).length;
        var work = d.splits.join(' + ') + (logged ? (d.splits.length ? ' · ' : '') + plural(logged, 'exercise') : '') + (vol ? ' · ' + n(vol) + ' kg' : '');
        return h('tr', null,
          h('td', null, demo ? label : h('button', { type: 'button', class: 'linkbtn', onclick: function () { setDate(k); setView('log'); } }, label)),

      })))));
    root.appendChild(h('p', { class: 'hint' }, demo ? 'These rows are examples' : 'Tap a date to edit that day. Deficit = TDEE − calories in; a minus means a surplus'));
  }

  // ---------- TDEE plan ----------
  function planDates(p) {
    return fmtRow.format(keyToDate(p.start)) + ' to ' + (p.end ? fmtRow.format(keyToDate(p.end)) : 'no end date');
  }
  function savePlans() {

  }
  function renderPlan() {

    }));
    root.appendChild(h('div', { class: 'sect' },

        box('plan-target', 'Calorie target (optional)', numberInput('plan-target', edit ? edit.target : null, 'e.g. 1800')),
        box('plan-cardio', 'Cardio goal for the period, min (optional)', numberInput('plan-cardio', edit ? edit.cardioGoal : null, 'e.g. 600')),
        box('plan-start', 'Start date', h('input', { id: 'plan-start', class: 'txt', type: 'date', value: edit ? edit.start : todayKey() })),
        box('plan-end', 'End date (optional)', h('input', { id: 'plan-end', class: 'txt', type: 'date', value: edit && edit.end ? edit.end : '' }))),
      h('div', { class: 'plan-actions' },
        h('button', { type: 'button', class: 'btn primary', id: 'plan-save', onclick: submit }, edit ? 'Save changes' : 'Save period'),
        edit && h('button', { type: 'button', class: 'btn', onclick: function () { editingPlan = null; renderPlan(); } }, 'Cancel'))));
    var current = planFor(todayKey());
    var list = state.plans.slice().sort(function (a, b) { return a.start < b.start ? 1 : -1; });
    root.appendChild(h('div', { class: 'sect' },
      h('h3', null, 'Periods'),
      !list.length && h('div', { class: 'empty' }, 'No periods yet. Add one above and your cal deficit appears in the Log tab'),
      list.map(function (p) {
        return h('div', { class: 'ex' },
          h('div', { class: 'plan-title' }, GOALS[p.goal] + ' · TDEE ' + n(p.tdee) + ' kcal', p === current && h('span', { class: 'pr' }, 'Now')),
          h('div', { class: 'ex-sum' }, planDates(p) + (p.target != null ? ' · Target ' + n(p.target) + ' kcal' : '') + (p.cardioGoal ? ' · Cardio ' + n(p.cardioGoal) + ' min' : '')),
          h('div', { class: 'plan-actions' },
            h('button', { type: 'button', class: 'btn', onclick: function () { editingPlan = p.id; renderPlan(); window.scrollTo(0, 0); } }, 'Edit'),
            h('button', { type: 'button', class: 'btn', onclick: function () {
              var at = state.plans.indexOf(p);

            } }, 'Delete')));

  }

  // ---------- goals ----------
  function hitCalories(p, d) {
    if (d.calIn == null) return false;
    var t = p.target != null ? p.target : p.tdee;
    if (p.goal === 'cut') return d.calIn <= t;
    if (p.goal === 'bulk') return d.calIn >= t;
    return Math.abs(d.calIn - t) <= 100;
  }
  function calorieRule(p) {
    var t = n(p.target != null ? p.target : p.tdee);
    if (p.goal === 'cut') return 'Eat ' + t + ' kcal or less';
    if (p.goal === 'bulk') return 'Eat ' + t + ' kcal or more';
    return 'Eat within 100 kcal of ' + t;
  }
  function goalRow(title, rule, value, total, unit, reached) {
    return h('div', { class: 'goal-row' },
      h('div', { class: 'goal-head' }, h('b', null, title), reached && h('span', { class: 'pr' }, '★ Done')),
      h('div', { class: 'ex-sum' }, rule),
      h('div', { class: 'meter', role: 'img', 'aria-label': value + ' of ' + total + ' ' + unit }, h('i', { style: 'width:' + (total ? Math.min(100, Math.round(value / total * 100)) : 0) + '%' })),
      h('div', { class: 'chart-sum' }, n(value) + ' of ' + n(total) + ' ' + unit));
  }
  function renderGoals() {
    var root = $('goals'); root.textContent = '';
    if (!state.loaded) return;
    var today = todayKey(), current = planFor(today);
    var list = state.plans.slice().sort(function (a, b) {
      if (a === current) return -1;
      if (b === current) return 1;
      return a.start < b.start ? 1 : -1;
    });
    root.appendChild(h('h3', { class: 'goals-title' }, 'Goals for ' + profile().label));
    if (!list.length) {
      root.appendChild(h('div', { class: 'empty' }, 'Add a period in the Plan tab and its goals appear here'));
      root.appendChild(h('button', { type: 'button', class: 'btn primary', id: 'goals-to-plan', onclick: function () { setView('plan'); } }, 'Go to Plan'));
      return;
    }
    list.forEach(function (p) {
      var last = p.end && p.end < today ? p.end : today;
      var total = p.start > today ? 0 : keyToIdx(last) - keyToIdx(p.start) + 1;
      var finished = !!p.end && p.end < today;
      var hits = Object.keys(state.days).filter(function (k) { return k >= p.start && k <= last && hitCalories(p, state.days[k]); }).length;
      var minutes = cardioIn(p);
      root.appendChild(h('div', { class: 'ex goal-card' },
        h('div', { class: 'plan-title' }, GOALS[p.goal] + ' · TDEE ' + n(p.tdee) + ' kcal', p === current && h('span', { class: 'now' }, 'Now')),
        h('div', { class: 'ex-sum' }, planDates(p)),
        goalRow('Calories', calorieRule(p), hits, total, 'days on target', finished && total > 0 && hits === total),
        p.cardioGoal ? goalRow('Cardio', 'Do ' + n(p.cardioGoal) + ' minutes in this period', minutes, p.cardioGoal, 'min', minutes >= p.cardioGoal) : null));
    });
  }

  // ---------- views ----------
  function setView(v) { state.view = v; applyView(); window.scrollTo(0, 0); }
  function applyView() {
    var v = state.view;
    $('log').hidden = v !== 'log';
    $('charts').hidden = v !== 'charts';
    $('history').hidden = v !== 'history';
    $('plan').hidden = v !== 'plan';
    $('goals').hidden = v !== 'goals';
    $('data-tools').hidden = v !== 'history';
    ['log', 'charts', 'history', 'plan', 'goals'].forEach(function (x) {
      var b = $('nav-' + x);
      if (x === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });

    if (v === 'history') renderHistory();
    if (v === 'plan') renderPlan();
    if (v === 'goals') renderGoals();
  }
  var viewTimer = null;
  function refreshReadViews() {

  }
  document.querySelectorAll('nav button').forEach(function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-view')); }); });
  var lastW = 0;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return; lastW = window.innerWidth;
    clearTimeout(viewTimer); viewTimer = setTimeout(applyView, 150);
  });

  function renderAll() {
    renderLog(); applyView();
  }

  // ---------- Excel export ----------
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (ok, fail) {
      var s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = function () { ok(window.XLSX); };
      s.onerror = fail;
      document.head.appendChild(s);
    });
  }
  function workbookBytes(XLSX) {
    var keys = Object.keys(state.days).sort();
    var daily = [['Date', 'Workout', 'Calories in (kcal)', 'Calories out (kcal)', 'Net (kcal)', 'Goal', 'TDEE (kcal)', 'Cal deficit (kcal)', 'Protein (g)', 'Cardio (min)', 'Body weight (kg)', 'Exercises', 'Volume (kg)']];
    var sets = [['Date', 'Workout', 'Exercise', 'Set', 'Weight (kg)', 'Reps', 'Volume (kg)']];
    keys.forEach(function (k) {
      var d = state.days[k], workout = d.splits.join(' + ');
      var vol = d.exercises.reduce(function (a, e) { return a + volume(e); }, 0);
      var plan = planFor(k);
      daily.push([k, workout, d.calIn, d.calOut, d.calIn != null && d.calOut != null ? d.calIn - d.calOut : null, plan ? GOALS[plan.goal] : null, plan ? plan.tdee : null, deficitFor(d, k), d.protein, d.cardio, d.weight, d.exercises.filter(hasValues).length || null, vol || null]);

    wsDaily['!cols'] = [12, 22, 16, 17, 10, 10, 11, 16, 11, 12, 16, 10, 11].map(function (w) { return { wch: w }; });
    wsSets['!cols'] = [12, 22, 26, 6, 11, 7, 11].map(function (w) { return { wch: w }; });
    XLSX.utils.book_append_sheet(wb, wsDaily, 'Daily log');
    XLSX.utils.book_append_sheet(wb, wsSets, 'Lifting sets');
    return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  }
  function setupExport(downloads) {
    var btn = $('export-xlsx');
    btn.hidden = false;

      if (!Object.keys(state.days).length) { toast('Nothing to export yet. Log your first day, then try again'); return; }
      flushNow();

      loadXlsx().then(function (XLSX) {
        var bytes = workbookBytes(XLSX);

        var a = h('a', { href: url, download: filename });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        toast('Excel file saved');
      }, function () {
        toast('Unable to load the Excel tool. Check your connection and try again');
      }).then(function () { btn.disabled = false; });

  }

  // ---------- backup (standalone file only) ----------
  function setupBackup() {
    var file = $('backup-file');
    $('backup').hidden = false;
    $('backup-save').addEventListener('click', function () {
      flushNow();
      var body = JSON.stringify({ app: 'somjod', version: 1, profile: state.profile, exportedAt: new Date().toISOString(), days: state.days, customSplits: state.customSplits, plans: state.plans }, null, 1);
      var url = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
      var a = h('a', { href: url, download: 'training-logbook-backup-' + fileTag() + todayKey() + '.json' });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      toast('Backup created for ' + profile().label + ': ' + plural(Object.keys(state.days).length, 'day'));
    });
    $('backup-load').addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () {
      var f = file.files[0]; file.value = '';
      if (!f) return;
      f.text().then(function (text) {
        var data = JSON.parse(text);
        if (!data || data.app !== 'somjod' || !data.days || typeof data.days !== 'object') throw new Error('format');
        if (data.profile && data.profile !== state.profile) {
          var owner = PROFILES.filter(function (p) { return p.id === data.profile; })[0];
          if (!window.confirm('This backup belongs to ' + (owner ? owner.label : 'someone else') + '. Restore it into ' + profile().label + '?')) return;
        }
        var keys = Object.keys(data.days).filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); });
        var clash = keys.filter(function (k) { return state.days[k]; }).length;
        if (clash && !window.confirm('This file overlaps with ' + plural(clash, 'day') + ' already saved here. Restoring replaces them with the versions in the file. Continue?')) return;
        keys.forEach(function (k) { state.days[k] = normalize(data.days[k] || {}, k); });
        (Array.isArray(data.plans) ? data.plans : []).forEach(function (p) {
          if (p && p.id && !state.plans.some(function (x) { return x.id === p.id; })) state.plans.push(p);
        });
        (Array.isArray(data.customSplits) ? data.customSplits : []).forEach(function (s) {
          s = String(s); if (state.customSplits.indexOf(s) < 0) state.customSplits.push(s);
        });
        if (saveLocal()) setStatus(savedLabel()); else setStatus('Unable to save: this browser is blocking storage', true);
        renderAll();
        toast('Restored ' + plural(keys.length, 'day') + ' to ' + profile().label);
      }).catch(function () { toast('Unable to open this file. Choose a file whose name starts with training-logbook-backup'); });
    });
  }

  // ---------- boot ----------
  function startLocal() {
    state.mode = 'local';
    try {
      var last = localStorage.getItem(PROFILE_KEY);
      if (PROFILES.some(function (p) { return p.id === last; })) state.profile = last;
    } catch (e) {}
    loadProfile();
    state.loaded = true;
    setStatus(savedLabel());
    renderWho();
    renderAll();
  }
  function startDb(database, uid) {
    db = database; state.mode = 'db';
    col = db.collection('data/users/' + uid);
    var waiting = setTimeout(function () {

    }, 10000);

      var definitive = !snap.metadata.fromCache;

        var body = doc.data();

          var cs = Array.isArray(body.customSplits) ? body.customSplits.map(String) : [];
          if (JSON.stringify(cs) !== JSON.stringify(state.customSplits)) { state.customSplits = cs; changed = true; currentChanged = true; }
          return;
        }
        if (doc.id.slice(0, 4) !== 'day-') return;
        var k = doc.id.slice(4); seen[k] = 1;
        if (dirty[k] || inflight[k]) return;
        var next = normalize(body, k);
        if (JSON.stringify(next) !== JSON.stringify(state.days[k])) {
          state.days[k] = next; changed = true;
          if (k === state.date) currentChanged = true;
        }
      });
      Object.keys(state.days).forEach(function (k) {
        if (!seen[k] && !dirty[k] && !inflight[k]) {
          delete state.days[k]; changed = true;
          if (k === state.date) currentChanged = true;
        }
      });
      state.loaded = true;
      if (!wasLoaded) { if (definitive) setStatus(savedLabel()); renderAll(); return; }
      if (changed) {
        var a = document.activeElement;

      }

      if (waiting) { clearTimeout(waiting); waiting = null; }
      setStatus(e && e.code === 'revoked' ? 'Your access to this logbook changed' : 'Unable to load your logbook. Try reopening this page', true);
      if (!state.loaded) { state.mode = 'local'; startLocal(); }
    });
  }

  state.date = todayKey();
  try { var rg = localStorage.getItem(LOCAL_KEY + '-range'); if (rg === '30' || rg === '90' || rg === 'all') state.range = rg; } catch (e) {}

  if (!window.claude || !window.claude.use) { setupBackup(); setupExport(null); startLocal(); return; }
  window.claude.use('downloads').then(function (d) { if (d) setupExport(d); }, function () {});
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    var database = r[0], user = r[1];
    if (!database || !user) return startLocal();
    return user.id().then(function (uid) { if (uid) startDb(database, uid); else startLocal(); });
  }).catch(startLocal);
})();
